[project]
name = "lecture-slides"
version = "0.1.0"
description = "Download lectures and extract stable, timestamped slides at native resolution"
requires-python = ">=3.11"
dependencies = ["av>=14", "numpy>=2", "opencv-python-headless>=4.10", "yt-dlp[default]>=2025.1.1"]

[project.scripts]
lecture-slides = "lecture_slides:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
