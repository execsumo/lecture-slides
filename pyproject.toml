[project]
name = "lecture-slides"
version = "0.1.1"
description = "Native-resolution lecture slides with a synchronized transcript reader"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
dependencies = ["av>=14", "numpy>=2", "opencv-python-headless>=4.10", "yt-dlp[default]>=2025.1.1"]

[project.scripts]
lecture-slides = "lecture_slides:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
